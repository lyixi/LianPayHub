<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联付中枢支付</title>
  <style>
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at top,#eef4ff,transparent 32%),#f6f8fc;color:#172033}.wrap{max-width:760px;margin:0 auto;padding:42px 18px 80px}.card{background:#fff;border-radius:28px;box-shadow:0 20px 48px rgba(15,23,42,.08);border:1px solid rgba(15,23,42,.08);padding:28px}.eyebrow{display:inline-flex;padding:5px 10px;border-radius:999px;background:#eef2ff;color:#4f46e5;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.brand{font-size:34px;font-weight:800;letter-spacing:-.05em;margin:14px 0 8px}.muted{color:#667085;line-height:1.8}.row{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #edf0f5;padding:14px 0}.amount{font-size:34px;font-weight:800;letter-spacing:-.05em}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:14px;background:#0f766e;color:white;padding:12px 18px;font-weight:800;text-decoration:none;cursor:pointer}.secondary{background:#eef2ff;color:#4f46e5}.status{margin-top:18px;padding:16px;border-radius:18px;background:#f8fafc;border:1px solid rgba(15,23,42,.08)}.qr{word-break:break-all;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:14px;padding:14px;margin-top:16px}.ok{color:#067647;font-weight:800}.warn{color:#b54708;font-weight:800}.hidden{display:none}@media(max-width:640px){.brand{font-size:28px}.actions .btn{width:100%}}</style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="eyebrow">Secure Payment</div>
  <div class="brand">请完成支付</div>
  <p id="hint" class="muted">正在加载订单...</p>
  <div id="orderBox" class="hidden">
    <div class="row"><span>订单号</span><strong id="orderNo"></strong></div>
    <div class="row"><span>金额</span><span class="amount" id="amount"></span></div>
    <div class="row"><span>状态</span><span id="status"></span></div>
    <div id="payBox" class="qr hidden"></div>
    <div id="finalBox" class="status hidden"></div>
    <div class="actions">
      <a id="openPay" class="btn hidden" target="_blank" rel="noopener">打开支付</a>
      <button id="copyBtn" class="btn secondary hidden" type="button">复制支付链接</button>
      <button id="refreshBtn" class="btn secondary" type="button">刷新状态</button>
    </div>
  </div>
</div></div>
<script>
var qs=new URLSearchParams(location.search);var orderNo=qs.get('orderNo')||'';var payUrl=qs.get('payUrl')||qs.get('qrCode')||qs.get('browserUrl')||'';var timer=null;
function money(c){return '¥'+(Number(c||0)/100).toFixed(2)}
function statusText(s){return {PENDING:'待支付',PAID:'已支付',CANCELLED:'已关闭',REFUNDED:'已退款',PARTIAL_REFUNDED:'部分退款'}[s]||s||'-'}
function renderPay(){if(!payUrl)return;document.getElementById('payBox').classList.remove('hidden');document.getElementById('payBox').textContent=payUrl;document.getElementById('openPay').href=payUrl;document.getElementById('openPay').classList.remove('hidden');document.getElementById('copyBtn').classList.remove('hidden')}
function stop(){if(timer){clearInterval(timer);timer=null}}
function load(silent){if(!orderNo){document.getElementById('hint').textContent='缺少 orderNo';return;}fetch('/api/payment/orders/'+encodeURIComponent(orderNo)).then(function(r){return r.json()}).then(function(res){if(res.code!==0)throw new Error(res.message||'订单加载失败');var o=res.data;document.getElementById('hint').textContent='支付完成后会自动更新状态';document.getElementById('orderBox').classList.remove('hidden');document.getElementById('orderNo').textContent=o.orderNo;document.getElementById('amount').textContent=money(o.amountCents);document.getElementById('status').textContent=statusText(o.payStatus);document.getElementById('status').className=o.payStatus==='PAID'?'ok':'warn';renderPay();if(o.payStatus==='PAID'){stop();document.getElementById('finalBox').classList.remove('hidden');document.getElementById('finalBox').innerHTML='<div class="ok">支付已完成</div><div style="margin-top:8px">订单号：'+esc(o.orderNo)+'</div>'+(o.tradeNo?'<div style="margin-top:8px">交易号：'+esc(o.tradeNo)+'</div>':'')+'<div class="muted" style="margin-top:8px">权益通常会在几秒内自动生效，如未生效可返回应用刷新状态。</div>'}}).catch(function(e){if(!silent)document.getElementById('hint').textContent=e.message})}
function start(){stop();load(true);timer=setInterval(function(){load(true)},3000)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]})}
document.getElementById('refreshBtn').onclick=function(){load(false)};document.getElementById('copyBtn').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(payUrl)};load(false);start();
</script>
</body>
</html>
