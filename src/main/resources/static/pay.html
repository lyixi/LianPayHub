<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>联付中枢支付</title>
  <style>
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f6f8fb;color:#17202a}.wrap{max-width:720px;margin:48px auto;padding:0 18px}.card{background:#fff;border-radius:18px;box-shadow:0 12px 36px rgba(20,30,55,.12);padding:28px}.brand{font-size:22px;font-weight:800;margin-bottom:8px}.muted{color:#667085}.row{display:flex;justify-content:space-between;gap:16px;border-top:1px solid #edf0f5;padding:14px 0}.amount{font-size:30px;font-weight:800}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}button,a.btn{border:0;border-radius:12px;background:#0f766e;color:white;padding:12px 18px;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#e6f2f1;color:#0f766e}.danger{color:#b42318}.qr{word-break:break-all;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:12px;padding:14px;margin-top:16px}.hidden{display:none}.ok{color:#067647;font-weight:800}.warn{color:#b54708;font-weight:800}
  </style>
</head>
<body>
<div class="wrap"><div class="card">
  <div class="brand">联付中枢支付</div>
  <p id="hint" class="muted">正在加载订单...</p>
  <div id="orderBox" class="hidden">
    <div class="row"><span>订单号</span><strong id="orderNo"></strong></div>
    <div class="row"><span>金额</span><span class="amount" id="amount"></span></div>
    <div class="row"><span>状态</span><span id="status"></span></div>
    <div id="payBox" class="qr hidden"></div>
    <div class="actions">
      <a id="openPay" class="btn hidden" target="_blank" rel="noopener">打开支付</a>
      <button id="copyBtn" class="secondary hidden" type="button">复制支付链接</button>
      <button id="refreshBtn" class="secondary" type="button">刷新状态</button>
    </div>
  </div>
</div></div>
<script>
var qs = new URLSearchParams(location.search);
var orderNo = qs.get('orderNo') || '';
var payUrl = qs.get('payUrl') || qs.get('qrCode') || qs.get('browserUrl') || '';
function money(cents){return '¥'+(Number(cents||0)/100).toFixed(2)}
function statusText(s){return {PENDING:'待支付',PAID:'已支付',CANCELLED:'已关闭',REFUNDED:'已退款',PARTIAL_REFUNDED:'部分退款'}[s]||s||'-'}
function renderPay(){
  if(!payUrl)return;
  document.getElementById('payBox').classList.remove('hidden');
  document.getElementById('payBox').textContent = payUrl;
  document.getElementById('openPay').href = payUrl;
  document.getElementById('openPay').classList.remove('hidden');
  document.getElementById('copyBtn').classList.remove('hidden');
}
function load(){
  if(!orderNo){document.getElementById('hint').textContent='缺少 orderNo';return;}
  fetch('/api/payment/orders/'+encodeURIComponent(orderNo)).then(function(r){return r.json()}).then(function(res){
    if(res.code!==0)throw new Error(res.message||'订单加载失败');
    var o=res.data;
    document.getElementById('hint').textContent='请完成支付后刷新状态';
    document.getElementById('orderBox').classList.remove('hidden');
    document.getElementById('orderNo').textContent=o.orderNo;
    document.getElementById('amount').textContent=money(o.amountCents);
    document.getElementById('status').textContent=statusText(o.payStatus);
    document.getElementById('status').className=o.payStatus==='PAID'?'ok':'warn';
    renderPay();
  }).catch(function(e){document.getElementById('hint').textContent=e.message;document.getElementById('hint').className='danger'});
}
document.getElementById('refreshBtn').onclick=load;
document.getElementById('copyBtn').onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(payUrl)};
load();
</script>
</body>
</html>
