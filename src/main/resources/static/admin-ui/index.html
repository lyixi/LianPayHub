<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1116">
  <title>联付中枢</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <form id="loginForm" class="login-panel">
      <div class="brand">联付中枢</div>
      <label>用户名<input id="username" autocomplete="username" value="admin"></label>
      <label>密码<input id="password" type="password" autocomplete="current-password" value="admin123456"></label>
      <button type="submit">登录</button>
      <p id="loginError" class="error" aria-live="polite"></p>
    </form>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="sidebar-title">联付中枢</div>
      <div class="nav-group">工作台</div>
      <button type="button" data-view="dashboard" class="nav active">总览</button>
      <div class="nav-group">业务</div>
      <button type="button" data-view="apps" class="nav">APP</button>
      <button type="button" data-view="channels" class="nav">平台</button>
      <button type="button" data-view="commerce" class="nav">交易</button>
      <button type="button" data-view="users" class="nav">用户</button>
      <button type="button" data-view="bindings" class="nav">绑定</button>
      <button type="button" data-view="devices" class="nav">设备</button>
      <button type="button" data-view="members" class="nav">会员</button>
      <div class="nav-group">审计</div>
      <button type="button" data-view="callbacks" class="nav">回调</button>
      <button type="button" data-view="launches" class="nav">启动</button>
      <button type="button" data-view="adapter" class="nav">适配</button>
      <button type="button" data-view="logs" class="nav">日志</button>
      <div class="nav-group">系统</div>
      <button type="button" data-view="admins" class="nav">管理员</button>
      <button type="button" data-view="tools" class="nav">工具</button>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="topbar-copy">
          <span class="eyebrow">Control Center</span>
          <h1 id="pageTitle">总览</h1>
          <span id="subTitle"></span>
        </div>
        <div class="top-actions">
          <select id="accentSelect" class="theme-select" aria-label="主题色">
            <option value="teal">青绿</option>
            <option value="blue">钴蓝</option>
            <option value="gold">琥珀</option>
            <option value="rose">玫红</option>
            <option value="violet">紫晶</option>
          </select>
          <button id="themeToggleBtn" class="secondary icon-action" type="button" title="切换深浅色" aria-label="切换深浅色">
            <svg class="theme-svg" viewBox="0 0 24 24" aria-hidden="true">
              <g class="icon-sun">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
              </g>
              <path class="icon-moon" d="M20.2 14.4A8.2 8.2 0 0 1 9.6 3.8a8.7 8.7 0 1 0 10.6 10.6Z"></path>
            </svg>
          </button>
          <button id="refreshBtn" class="secondary" type="button">刷新</button>
          <button id="logoutBtn" class="secondary" type="button">退出</button>
        </div>
      </header>

      <section id="dashboard" class="view"></section>
      <section id="apps" class="view hidden"></section>
      <section id="channels" class="view hidden"></section>
      <section id="searchPlatforms" class="view hidden"></section>
      <section id="commerce" class="view hidden"></section>
      <section id="users" class="view hidden"></section>
      <section id="bindings" class="view hidden"></section>
      <section id="devices" class="view hidden"></section>
      <section id="members" class="view hidden"></section>
      <section id="callbacks" class="view hidden"></section>
      <section id="launches" class="view hidden"></section>
      <section id="adapter" class="view hidden"></section>
      <section id="logs" class="view hidden"></section>
      <section id="admins" class="view hidden"></section>
      <section id="tools" class="view hidden"></section>
    </main>
  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>
  <div id="modalMask" class="modal-mask hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modalTitle"></h2>
        <button id="modalCloseBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>
  <div id="subModalMask" class="modal-mask sub-modal-mask hidden">
    <div class="modal sub-modal">
      <div class="modal-head">
        <h2 id="subModalTitle"></h2>
        <button id="subModalCloseBtn" class="icon-btn" type="button" aria-label="关闭">×</button>
      </div>
      <div id="subModalBody" class="modal-body"></div>
      <div id="subModalFooter" class="modal-footer"></div>
    </div>
  </div>
  <script src="./app.js"></script>
</body>
</html>
