server:
  port: 8888

spring:
  application:
    name: lianpayhub-server
  devtools:
    restart:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3306/lianpayhub?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: iwxyiroot
  flyway:
    enabled: false
    baseline-on-migrate: true
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL57Dialect
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

lianpayhub:
  security:
    jwt-secret: change-me-to-a-long-random-secret-for-production
    jwt-expire-minutes: 720
    sms-code-required: false
    sms-code-expire-minutes: 5
    sms-code-cooldown-seconds: 60
    sms-code-max-attempts: 5
    sms-debug-return-code: true
    sms-provider: aliyun
    api-auth-enabled: false
    api-auth-mode: secret
    api-signature-time-window-seconds: 300
    admin-ip-whitelist: []
  admin:
    default-username: admin
    default-password: admin123456
    force-default-password-change: false
    password-complexity-required: false
    export-enabled: true
  payment:
    dev-tools-enabled: true
    order-expire-minutes: 30
    order-auto-close-enabled: true
    order-close-scan-fixed-delay-ms: 60000
  storage:
    backend: local                          # local | aliyun-oss
    local-path: ./storage
    local-base-url: http://localhost:8888/files
    max-config-file-bytes: 524288           # 512 KB
    max-image-file-bytes: 5242880           # 5 MB
    default-quota-bytes: 52428800           # 50 MB per (user, app)
    max-file-count: 500
    max-path-depth: 8
    upload-rate-limit-per-minute: 20
